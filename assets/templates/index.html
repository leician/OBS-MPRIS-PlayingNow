<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Now Playing</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: #f4f6f2;
            font-family: system-ui, sans-serif;
            zoom: 2;
        }

        .now-playing {
            display: flex;
            align-items: center;
            gap: 16px;
            width: min(100%, 400px);
            padding: 12px;
            background: rgba(20, 25, 23, 0.94);
            border-radius: 8px;
        }

        .disc {
            animation: spin 4.5s linear infinite;
            animation-play-state: paused;
            position: relative;
            flex: 0 0 88px;
            width: 88px;
            height: 88px;
            overflow: hidden;
            border-radius: 50%;
            background:
                repeating-radial-gradient(circle, rgba(255, 255, 255, 0.14) 0 1px, transparent 1.5px 3px),
                conic-gradient(from 35deg, #d8ddd9, #64716b, #e8ece9, #59645f, #cbd1cd, #77817c, #d8ddd9);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255, 255, 255, 0.45);
        }

        .disc.is-spinning {
            animation-play-state: running;
        }

        .disc-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.72;
        }

        .disc::after {
            position: absolute;
            z-index: 2;
            top: 50%;
            left: 50%;
            width: 15px;
            height: 15px;
            border: 2px solid rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            background: #202723;
            content: "";
            transform: translate(-50%, -50%);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .disc.is-spinning {
                animation: none;
            }
        }

        .track-info {
            min-width: 0;
        }

        .title,
        .artist {
            margin: 0;
            overflow-wrap: anywhere;
        }

        .title {
            overflow: hidden;
            white-space: nowrap;
            font-size: 18px;
            font-weight: 700;
            line-height: 1.25;
        }

        .title.is-overflowing .title-text {
            display: inline-block;
            animation: title-marquee 6s linear infinite alternate;
        }

        @keyframes title-marquee {
            to {
                transform: translateX(calc(-1 * var(--scroll-distance)));
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .title.is-overflowing .title-text {
                animation: none;
            }
        }

        .artist {
            margin-top: 5px;
            color: #bdc7c0;
            font-size: 14px;
            line-height: 1.3;
        }
    </style>
</head>
<body>
    <script>
        setInterval(function() {
            var metadata = fetch("/api/metadata")
            .then((response) => response.json())
            .then((responseJSON) => {
                var title = document.getElementById("track-title");
                var titleText = document.getElementById("track-title-text");
                var artist = document.getElementById("track-artist");
                var cover = document.getElementById("album-art");
                var disc = document.querySelector(".disc")

                console.log(responseJSON)

                var status = responseJSON.status
                disc.classList.toggle("is-spinning", status === "Playing");

                var newTitle = responseJSON.title || "N/A";
                if (titleText.textContent !== newTitle) {
                    titleText.textContent = newTitle;
                }
                var scrollDistance = Math.max(0, titleText.scrollWidth - title.clientWidth);
                title.style.setProperty("--scroll-distance", scrollDistance + "px");
                title.style.setProperty("--scroll-duration", Math.max(6, scrollDistance / 20) + "s");
                title.classList.toggle("is-overflowing", scrollDistance > 1);
                artist.innerHTML = responseJSON.artist
                cover.src = responseJSON.cover
            });
        }, 500);
    </script>
    <main class="now-playing">
        <div class="disc" role="img" aria-label="Spinning compact disc">
            <img
                class="disc-image"
                id="album-art"
                src=""
                alt=""
            >
        </div>
        <div class="track-info">
            <p class="title" id="track-title"><span class="title-text" id="track-title-text">N/A</span></p>
            <p class="artist" id="track-artist">N/A</p>
        </div>
    </main>
</body>
</html>
